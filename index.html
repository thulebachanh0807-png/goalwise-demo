<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoalWise AI | yofi</title><style>
:root{--pink:#a50064;--bright:#d82d8b;--ink:#25212a;--muted:#716b75;--line:#f0dce7;--soft:#fff0f7;--green:#16865b;--red:#c9364e;--amber:#9b650c}*{box-sizing:border-box}body{margin:0;background:#fff9fc;color:var(--ink);font:15px/1.55 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--pink);color:white;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:var(--soft);color:var(--pink)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ee94c7}header{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}header>div,main,nav>div{max-width:1000px;margin:auto;padding:16px 20px}header>div,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{color:var(--pink);font-weight:900;font-size:24px;letter-spacing:-1px}.tag,small{font-size:12px;color:var(--muted)}.tag{background:var(--soft);color:var(--pink);padding:5px 9px;border-radius:20px}main{padding-bottom:110px}h1{font-size:29px;line-height:1.2;margin:8px 0 12px;letter-spacing:-.8px}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0 14px}h3{margin:10px 0;font-size:16px}.hero{background:linear-gradient(120deg,#780047,#a50064 65%,#d82d8b);color:white;border-radius:24px;padding:26px;margin:8px 0 20px}.hero small{color:#ffe3f1}.hero button{background:white;color:var(--pink)}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 7px 24px #a5006408}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid .card{margin:0}.metric{font-size:25px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.7px}.muted{color:var(--muted)}.green{color:var(--green)}.red{color:var(--red)}.warn{background:#fff5e3;color:#79510b;border-radius:12px;padding:12px;margin:10px 0}.good{background:#eaf8f1;color:#146848;border-radius:12px;padding:12px;margin:10px 0}.risk{background:#fdeef1;color:#a02037;border-radius:12px;padding:12px;margin:10px 0}.field{display:block;margin:9px 0}.field span{display:block;font-size:13px;font-weight:650;margin-bottom:4px}input:not([type=checkbox]),select{width:100%;min-width:0;border:1px solid #dfcbd7;border-radius:10px;padding:10px;background:white;color:var(--ink)}input[type=checkbox]{accent-color:var(--pink);width:19px;height:19px;vertical-align:middle}a{color:var(--pink)}nav{position:fixed;bottom:0;background:white;border-top:1px solid var(--line);width:100%;z-index:4}nav>div{display:flex;justify-content:space-around;padding:8px}nav button{background:white;color:var(--muted);font-size:12px;padding:8px;flex:1}nav button.active{background:var(--soft);color:var(--pink)}nav b{display:block;font-size:21px}.bar{height:9px;border-radius:20px;background:#f0e8ed;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:var(--bright);border-radius:20px}.budget{border-top:1px solid var(--line);padding:13px 0}.budgetgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.pill{padding:4px 8px;background:var(--soft);color:var(--pink);border-radius:14px;font-size:11px;font-weight:700}.donut{width:150px;height:150px;border-radius:100%;display:grid;place-items:center;flex-shrink:0}.donut>div{background:white;border-radius:100%;width:108px;height:108px;display:grid;place-content:center;text-align:center}.legend{flex:1;font-size:12px}.legend div{display:flex;justify-content:space-between;gap:5px;padding:3px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.progress{font-size:32px;font-weight:850}.hidden{display:none}details{margin:10px 0}summary{cursor:pointer;color:var(--pink);font-weight:650}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px 5px;border-bottom:1px solid var(--line)}td:last-child,th:last-child{text-align:right}footer{font-size:12px;color:var(--muted);margin:20px 0}.chart{height:140px;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--line);padding:0 4px}.chart>div{flex:1;background:#d82d8b;border-radius:5px 5px 0 0;min-width:1px}.note{font-size:12px;color:var(--muted)}@media(max-width:650px){header>div,main{padding:13px 15px}main{padding-bottom:100px}.grid{grid-template-columns:1fr}.hero{padding:20px}.metric{font-size:23px}.card{padding:16px}h1{font-size:25px}.donut{width:125px;height:125px}.donut>div{width:91px;height:91px}.legend{font-size:11px}}
</style></head><body><header><div><div><div class="brand">‹ GoalWise<span style="color:#d82d8b"> AI</span></div><small>yofi · MoMo-inspired prototype</small></div><button class="secondary" onclick="go('demo')">Chế độ Demo</button></div></header><main id="app"></main><nav><div id="nav"></div></nav>
<script>
'use strict';
const C=[['home','Nhà ở',2000000],['food','Ăn uống',2000000],['travel','Di chuyển',700000],['bills','Điện, nước, Internet',300000],['education','Học tập',400000],['health','Y tế',0],['shopping','Mua sắm',1200000],['fun','Giải trí',800000],['subscriptions','Đăng ký dịch vụ',200000],['other','Chi phí khác',200000]];
const optional=['shopping','fun','subscriptions'];
const sources=[
['S01','CPI Việt Nam · 10 tháng 2026','https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2026/11/chi-so-gia-tieu-dung-chi-so-gia-vang-va-chi-so-gia-do-la-my-thang-muoi-va-muoi-thang-nam-2026/','4,57% — dữ liệu lưu từ database trước, kịch bản lịch sử, không phải dự báo.'],
['S02','SCOLI 2025','https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2026/04/thong-cao-bao-chi-chi-so-gia-sinh-hoat-theo-khong-gian-nam-2025/','Hà Nội 100; TP.HCM 97,96. Không suy ra chênh lệch cấp quận.'],
['S03','Khảo sát mức sống dân cư 2024','https://www.nso.gov.vn/tin-tuc-thong-ke/2025/05/thong-cao-bao-chi-ket-qua-khao-sat-muc-song-dan-cu-nam-2024/','Chi tiêu bình quân thành thị 3,8 triệu; nông thôn 2,5 triệu/người/tháng. Không phải mức sống tối thiểu cá nhân.'],
['S06','CFPB — Your Money, Your Goals','https://www.consumerfinance.gov/consumer-tools/educator-tools/your-money-your-goals/toolkit/','Theo dõi dòng tiền và lập ngân sách.'],
['S10','SEC — Savings Goal Calculator','https://www.investor.gov/financial-tools-calculators/calculators/savings-goal-calculator','Phương pháp tính khoản góp.'],
['S09','CFPB — Emergency Fund','https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/','Bảo vệ quỹ dự phòng.'],
['S15','Gargano & Rossi — Goal Setting and Saving in the FinTech Era','https://doi.org/10.1111/jofi.13339','Cơ sở nghiên cứu thiết lập mục tiêu; chưa chứng minh hiệu quả riêng của GoalWise.'],
['S17','Karlan et al. — How Reminders Increase Saving','https://doi.org/10.1287/mnsc.2015.2296','Cơ sở thử nghiệm nhắc nhở.'],
['S19','NHNN — Quy định rút trước hạn','https://baochinhphu.vn/quy-dinh-moi-ve-lai-suat-rut-truoc-han-tien-gui-10222062114522068.htm','Lãi không kỳ hạn đối với phần rút trước hạn theo điều kiện áp dụng.'],
['S24','NIST AI RMF','https://www.nist.gov/itl/ai-risk-management-framework','Minh bạch và quản trị rủi ro.']];
const demoBanks=[{name:'Sản phẩm mô phỏng A',min:100000,terms:{1:4.1,3:4.5,6:6.5,12:6.6},partial:true,minPartial:100000,remain:100000,early:.1},{name:'Sản phẩm mô phỏng B',min:1000000,terms:{1:3.9,3:4.8,6:5.8,12:6.2},partial:false,minPartial:0,remain:0,early:.1}];
const archivedBanks=[{name:'Cake by VPBank · Tiền gửi tiêu chuẩn',min:100000,terms:{1:4.75,3:4.75,6:6.9,12:6.9},partial:true,minPartial:100000,minShare:.1,maxShare:.9,remain:100000,early:.1,rateDate:'21/10/2026',url:'https://cake.vn/tien-gui/tien-gui-tieu-chuan'},{name:'Techcombank · Tiền gửi rút gốc linh hoạt Online',min:1000000,terms:{1:4.25,3:4.55,6:6.05,12:6.25},partial:true,minPartial:1000000,minShare:0,maxShare:1,remain:1000000,early:.1,rateDate:'24/10/2026',url:'https://techcombank.com/content/dam/techcombank/public-site/documents/tcb-bieu-lai-suat-tien-gui-tiet-kiem-tien-gui-co-ky-han-20261024.pdf',conditions:'https://techcombank.com/khach-hang-ca-nhan/tiet-kiem/tiet-kiem-linh-hoat/tien-gui-rut-goc-linh-hoat'}];let banks=demoBanks;
const sum=a=>a.reduce((x,y)=>x+y,0), cash=n=>Math.round(n).toLocaleString('vi-VN')+' ₫', num=n=>Math.max(0,Number(n)||0), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){let tx=[];for(let m=0;m<3;m++){tx.push({m,cat:'income',kind:'income',amount:9000000,merchant:'Lương mô phỏng'});for(const [id,label,a] of C){let value=a;if(m===0&&id==='shopping')value=600000;if(m===1&&id==='fun')value=400000;if(m===0&&id==='subscriptions')value=100000;if(value){tx.push({m,cat:id,kind:'expense',amount:value+(id==='shopping'?100000:0),merchant:label});if(id==='shopping')tx.push({m,cat:id,kind:'refund',amount:100000,merchant:'Hoàn tiền mua sắm'});}}tx.push({m,cat:'transfer',kind:'transfer',amount:500000,merchant:'Chuyển giữa tài khoản'});}return {consent:false,monitor:false,tx,goal:{name:'Mua laptop',price:18000000,saved:2000000,months:8,inflation:0,city:'HCM',area:'urban',housing:'rent',reserve:300000,debt:0},floors:{shopping:500000,fun:400000,subscriptions:100000},confirmed:false,locks:{},draft:null,approved:null,actual:{},alerts:[],threshold:90};}
let s;try{s=JSON.parse(localStorage.getItem('goalwise_v3'))||seed()}catch{s=seed()}let page='home', simulation=null;
function save(){try{localStorage.setItem('goalwise_v3',JSON.stringify(s))}catch{}}
function stats(m){let cats=Object.fromEntries(C.map(c=>[c[0],0])),income=0;for(const t of s.tx.filter(t=>t.m===m)){if(t.kind==='income')income+=t.amount;if(t.kind==='expense'&&t.cat in cats)cats[t.cat]+=t.amount;if(t.kind==='refund'&&t.cat in cats)cats[t.cat]-=t.amount;}for(const k in cats)cats[k]=Math.max(0,cats[k]);return {cats,income,expenses:sum(Object.values(cats))}}
function calculation(){const x=stats(2),g=s.goal,future=Math.ceil(g.price*Math.pow(1+g.inflation/100,g.months/12)),gap=Math.max(0,future-g.saved),required=Math.ceil(gap/g.months),capacity=x.income-x.expenses-g.debt-g.reserve;return {x,g,future,gap,required,capacity,shortfall:Math.max(0,required-capacity)}}
function floor(k,x){return !optional.includes(k)||s.locks[k]||!s.confirmed?x:Math.min(x,num(s.floors[k]))}
function optimize(){const q=calculation();let plan={...q.x.cats},need=q.shortfall;for(const k of ['subscriptions','fun','shopping']){const cut=Math.min(need,Math.max(0,plan[k]-floor(k,plan[k])));plan[k]-=cut;need-=cut;}s.draft=plan;save();return plan}
function evaluate(plan){const q=calculation(),total=sum(Object.values(plan)),capacity=q.x.income-total-q.g.debt-q.g.reserve;return {...q,total,after:capacity,feasible:capacity>=q.required,eta:capacity>0?Math.ceil(q.gap/capacity):q.gap===0?0:null}}
function history(k){return [0,1,2].map(m=>stats(m).cats[k])}
function invalidate(){s.draft=null;if(s.approved){s.approved=null;s.monitor=false;s.alerts=[];s.actual={}}save()}
function go(p){page=p;simulation=null;render();window.scrollTo(0,0)}
function field(label,key,type='number'){return '<label class="field"><span>'+label+'</span><input id="'+key+'" type="'+type+'" '+(type==='number'?'min="0" step="any"':'')+' value="'+esc(s.goal[key])+'"></label>'}
function select(label,key,options){return '<label class="field"><span>'+label+'</span><select id="'+key+'">'+options.map(([v,l])=>'<option value="'+v+'" '+(s.goal[key]===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label>'}
function metric(label,value,cls=''){return '<div><small>'+label+'</small><div class="metric '+cls+'">'+value+'</div></div>'}
function contextHtml(){let g=s.goal,city=g.city==='HN'?'Hà Nội: SCOLI 100':g.city==='HCM'?'TP.HCM: SCOLI 97,96':'Chưa có chỉ số thành phố phù hợp trong database';let area=g.area==='urban'?'Chi tiêu bình quân thành thị: 3,8 triệu ₫/người/tháng.':g.area==='rural'?'Chi tiêu bình quân nông thôn: 2,5 triệu ₫/người/tháng.':'Chưa có benchmark phù hợp cấp ngoại thành hoặc khu vực chưa xác định.';return '<div class="warn"><strong>Tham chiếu hoàn cảnh [S02, S03]</strong><br>'+city+' · '+area+'<br><small>Chỉ dùng để rà soát thông tin còn thiếu. Không thay thế chi phí thực tế hoặc tự cắt ngân sách.</small></div>'}
function sourceHtml(){return '<details><summary>Cơ sở đề xuất và giới hạn dữ liệu</summary>'+sources.map(a=>'<p><a target="_blank" rel="noopener" href="'+a[2]+'">'+a[0]+' · '+a[1]+'</a><br><small>'+a[3]+'</small></p>').join('')+'<small>Nguồn kế thừa từ database nghiên cứu, chưa kiểm tra trực tuyến trong bản này. Ngưỡng 75/90/100% và dữ liệu giao dịch là giả định demo.</small></details>'}
function bar(p,c='var(--bright)'){return '<div class="bar"><i style="width:'+Math.min(100,Math.max(0,p))+'%;background:'+c+'"></i></div>'}
function header(t,d){return '<h1>'+t+'</h1><p class="muted">'+d+'</p>'}
function render(){let q=calculation(),h='';document.getElementById('nav').innerHTML=[['home','⌂','Tổng quan'],['plan','✦','Kế hoạch'],['monitor','◎','Mục tiêu'],['bank','₫','Tiết kiệm']].map(([k,i,l])=>'<button class="'+(page===k?'active':'')+'" onclick="go(\''+k+'\')"><b>'+i+'</b>'+l+'</button>').join('');
if(page==='home'){if(!s.consent){h='<div class="hero"><small>QUẢN LÝ CHI TIÊU · TÍNH NĂNG ĐỀ XUẤT</small><h1>Chi tiêu thông minh hơn.<br>Đạt mục tiêu nhanh hơn.</h1><p>Biến lịch sử giao dịch thành kế hoạch tài chính cá nhân.</p><button onclick="go(\'consent\')">Lập kế hoạch cùng AI →</button></div><div class="card"><h2>Hiểu · Tối ưu · Theo dõi · Tiết kiệm</h2><p>Không cần nhập lại mọi giao dịch. GoalWise sử dụng dữ liệu đã phân loại (mô phỏng) để tính ngân sách theo mục tiêu.</p></div>'}else{const colors=['#a50064','#d82d8b','#ed9bc7','#9066aa','#e9b15f','#9db7bd','#aa588a','#e8c6da','#648b95','#d5cbd4'];let start=0;const slices=C.map(([k],i)=>{let end=start+(q.x.expenses?q.x.cats[k]/q.x.expenses*100:0);let v=colors[i]+' '+start+'% '+end+'%';start=end;return v});h=header('Bức tranh tài chính của bạn','Minh Anh · Tháng gần nhất đã hoàn tất · Dữ liệu mô phỏng')+'<div class="hero"><small>Thu nhập tháng</small><div class="progress">'+cash(q.x.income)+'</div><div class="grid">'+metric('Tổng chi',cash(q.x.expenses))+metric('Tiền dư sau dự phòng',cash(q.capacity))+'</div></div><div class="card"><h2>Phân bổ chi tiêu</h2><div class="row"><div class="donut" style="background:conic-gradient('+slices.join(',')+')"><div><small>Tổng chi</small><strong>'+cash(q.x.expenses)+'</strong></div></div><div class="legend">'+C.map(([k,l],i)=>'<div><span><i style="background:'+colors[i]+'"></i>'+l+'</span><b>'+cash(q.x.cats[k])+'</b></div>').join('')+'</div></div></div><div class="card"><h2>Giao dịch đã phân loại</h2>'+C.map(([k,l])=>'<details><summary>'+l+' · '+cash(q.x.cats[k])+'</summary>'+s.tx.filter(t=>t.m===2&&t.cat===k).map(t=>'<p>'+esc(t.merchant)+' · '+(t.kind==='refund'?'Hoàn tiền ':'')+cash(t.amount)+'</p>').join('')+'</details>').join('')+'<p class="note">Chuyển khoản nội bộ không tính vào thu nhập hoặc chi tiêu. Hoàn tiền giảm chi phí tương ứng. Dữ liệu ngoài MoMo có thể thiếu.</p><div class="actions"><button onclick="go(\'goal\')">Tạo mục tiêu →</button><button class="secondary" onclick="go(\'demo\')">Bổ sung dữ liệu</button></div></div>'}}
if(page==='consent'){h=header('Bạn kiểm soát dữ liệu','Chỉ dùng dữ liệu mô phỏng trên thiết bị này.')+'<div class="card"><h2>Cho phép lập kế hoạch</h2><p>GoalWise sử dụng lịch sử giao dịch, thu nhập, chi tiêu và số tiền dành cho mục tiêu. Vị trí chỉ là thông tin tùy chọn. Không kết nối tài khoản thật.</p><label><input id="allow" type="checkbox"> Tôi đồng ý sử dụng dữ liệu demo để lập kế hoạch.</label><div class="actions"><button onclick="if(document.getElementById(\'allow\').checked){s.consent=true;save();go(\'home\')}else alert(\'Vui lòng xác nhận trước khi tiếp tục.\')">Tiếp tục</button><button class="secondary" onclick="go(\'home\')">Từ chối</button></div></div>'}
if(page==='goal'){h=header('Bạn đang tiết kiệm cho điều gì?','Tạo mục tiêu và bổ sung thông tin tài chính cần thiết.')+'<div class="card">'+field('Tên mục tiêu','name','text')+'<div class="grid">'+field('Giá hiện tại (₫)','price')+field('Tiền đã dành riêng (₫)','saved')+field('Thời hạn (tháng, 1–120)','months')+field('Lạm phát giả định %/năm (0 = giá cố định)','inflation')+field('Dự phòng mỗi tháng (₫)','reserve')+field('Trả nợ mỗi tháng (₫)','debt')+'</div><button class="secondary" onclick="document.getElementById(\'inflation\').value=4.57">Thử kịch bản CPI 4,57%</button><small> CPI lịch sử, không phải dự báo.</small></div><div class="card"><h2>Hoàn cảnh của bạn</h2>'+select('Thành phố (tùy chọn)','city',[['HCM','TP.HCM'],['HN','Hà Nội'],['other','Khác / không cung cấp']])+select('Khu vực','area',[['urban','Thành thị'],['suburban','Ngoại thành'],['rural','Nông thôn'],['unknown','Không cung cấp']])+select('Nhà ở','housing',[['rent','Thuê nhà'],['family','Ở cùng gia đình'],['own','Nhà riêng'],['unknown','Không cung cấp']])+'<button onclick="setGoal()">Tiếp tục tối ưu ngân sách</button></div>'}

ton class="secondary" onclick="go(\'goal\')">Xem lại mục tiêu</button> <button class="secondary" onclick="rebalance()">Thử điều chuyển ngân sách</button>':'')+'</div><button onclick="go(\'bank\')">Khám phá tiết kiệm →</button>'}}

function locked(){return header('Cần xác nhận dữ liệu','Bắt đầu bằng quyền truy cập mô phỏng.')+'<button onclick="go(\'consent\')">Tiếp tục</button>'}
function val(id){return document.getElementById(id).value}
function setGoal(){let g={name:val('name').trim()||'Mục tiêu của tôi',price:num(val('price')),saved:num(val('saved')),months:Math.min(120,Math.max(1,Math.floor(num(val('months'))))),inflation:Math.min(30,num(val('inflation'))),reserve:num(val('reserve')),debt:num(val('debt')),city:val('city'),area:val('area'),housing:val('housing')};if(!g.price){alert('Nhập giá mục tiêu lớn hơn 0.');return}s.goal=g;invalidate();go('plan')}
function generate(){s.confirmed=document.getElementById('confirmFloor').checked;for(const k of optional)s.floors[k]=num(val('floor_'+k));optimize();render()}
function editBudget(k,v){let x=stats(2).cats[k];s.draft[k]=Math.min(x,Math.max(floor(k,x),num(v)));save();render()}
function lock(k,v){s.locks[k]=v;if(v)s.draft[k]=stats(2).cats[k];save();render()}
function approve(){let e=evaluate(s.draft);if(!e.feasible||!s.consent)return;for(const [k] of C)if(s.draft[k]<floor(k,e.x.cats[k])||s.draft[k]>e.x.cats[k])return;const version=(s.approved?.version||0)+1;s.approved={...s.goal,version,approvedAt:new Date().toISOString(),budget:{...s.draft},required:e.required,future:e.future,income:e.x.income};s.actual=Object.fromEntries(C.map(([k])=>[k,k==='shopping'?Math.min(550000,s.draft[k]):Math.floor(s.draft[k]*.35)]));s.alerts=[];s.monitor=false;save();go('monitor')}
function rebalance(){if(!s.approved||!s.monitor)return;let a=s.approved,b={...a.budget};let need=0;for(const [k] of C){let excess=Math.max(0,(s.actual[k]||0)-b[k]);b[k]+=excess;need+=excess}if(!need){alert('Chưa có khoản vượt cần điều chuyển.');return}let original=need;for(const k of ['subscriptions','fun','shopping']){if(s.locks[k])continue;let room=Math.max(0,b[k]-Math.max(s.actual[k]||0,floor(k,stats(2).cats[k])));let cut=Math.min(room,need);b[k]-=cut;need-=cut}if(need){alert('Không đủ ngân sách linh hoạt để bù '+cash(need)+'. Hãy xem lại thời hạn hoặc mục tiêu.');return}let changes=C.filter(([k])=>b[k]!==a.budget[k]).map(([k,l])=>l+': '+cash(a.budget[k])+' → '+cash(b[k])).join('\\n');if(confirm('Xác nhận điều chuyển '+cash(original)+'?\\n'+changes)){s.approved={...a,budget:b,version:a.version+1,approvedAt:new Date().toISOString()};save();render()}}
function forecastSavings(){let a=s.approved;return a.income-a.debt-a.reserve-sum(C.map(([k])=>Math.max(a.budget[k],s.actual[k]||0)))}
function addActual(){if(!s.approved||!s.monitor)return;let k=val('simcat'),amount=num(val('simamount'));if(!amount)return;let b=s.approved.budget[k],old=s.actual[k]||0,now=old+amount;s.actual[k]=now;let level=v=>v>b?3:b>0&&v/b*100>=s.threshold?2:b>0&&v/b*100>=75?1:0;let newLevel=level(now);if(newLevel>level(old)){let short=Math.max(0,s.approved.required-forecastSavings()),label=C.find(c=>c[0]===k)[1];s.alerts.unshift({title:label+(newLevel===3?' vượt ngân sách':' sắp chạm ngân sách'),text:'Đã chi '+cash(now)+' / '+cash(b)+'. '+(short?'Nếu giữ các ngân sách còn lại, thiếu '+cash(short)+' cho mục tiêu. Có thể cân nhắc điều chuyển khoản linh hoạt.':'Tổng dự báo vẫn đủ mục tiêu.')})}save();go('monitor')}
function updateIncome(){if(!s.consent){alert('Cần đồng ý sử dụng dữ liệu trước.');return}s.tx=s.tx.filter(t=>!(t.m===2&&t.kind==='income'));s.tx.push({m:2,cat:'income',kind:'income',amount:num(val('newincome')),merchant:'Thu nhập đã bổ sung'});invalidate();go('home')}
function addHistorical(){if(!s.consent)return;let a=num(val('histamt'));if(a)s.tx.push({m:2,cat:val('histcat'),kind:'expense',amount:a,merchant:'Giao dịch ngoài hệ thống'});invalidate();go('home')}
function eligible(p,h){return banks.flatMap(b=>Object.entries(b.terms).filter(([t])=>Number(t)<=h&&p>=b.min&&p>0).map(([t,r])=>({b,t:Number(t),r,interest:p*r/100*Number(t)/12}))).sort((a,b)=>b.interest-a.interest)}
function match(){banks=val('bankmode')==='archive'?archivedBanks:demoBanks;let a=s.approved,p=num(val('principal')),l=Math.floor(num(val('liquidity'))),out=document.getElementById('matches');if(p>a.saved||!p||l<1||l>a.months||a.income<a.debt+a.reserve+sum(Object.values(a.budget))){out.innerHTML='<div class="risk">Số tiền hoặc thời hạn không hợp lệ; không sử dụng tiền dự kiến hoặc tiền dự phòng.</div>';return}let list=eligible(p,a.months),A=list[0],B=A?list.find(x=>x.t<A.t&&x.t<=l):null;if(!A){out.innerHTML='<div class="warn">Không có sản phẩm đủ điều kiện.</div>';return}if(A.t>l){A=list.find(x=>x.t<=l);B=A?list.find(x=>x.t<A.t):null}if(!A){out.innerHTML='<div class="warn">Không có kỳ hạn đáp ứng thời điểm cần tiền.</div>';return}simulation={p,A,B};function card(x,label){return '<div class="card"><span class="pill">'+label+'</span><h2>'+x.b.name+'</h2><div class="metric">'+x.r+'%/năm</div>'+(x.b.rateDate?'<small>Lãi lịch sử từ '+x.b.rateDate+' · chưa xác minh lại · <a href="'+x.b.url+'" target="_blank" rel="noopener">Nguồn lãi suất</a>'+(x.b.conditions?' · <a href="'+x.b.conditions+'" target="_blank" rel="noopener">Điều kiện</a>':'')+'</small>':'<small>Lãi suất giả định</small>')+'<p>Kỳ hạn '+x.t+' tháng · Vốn '+cash(p)+'</p>'+metric('Lãi dự kiến đến đáo hạn',cash(x.interest),'green')+'<p><strong>Vì sao phù hợp?</strong> '+(label.includes('A')?'Lãi cao nhất trong danh mục mô phỏng đủ điều kiện và giới hạn thanh khoản.':'Đáo hạn sớm hơn, phù hợp nhu cầu tiếp cận tiền.')+'</p><small>Không tái tục; sau đáo hạn giả định không có thêm lãi đến cuối kỳ kế hoạch. '+(x.b.partial?'Có rút một phần theo điều kiện demo.':'Không hỗ trợ rút từng phần.')+'</small></div>'}out.innerHTML='<div class="grid">'+card(A,'A · Ưu tiên lãi')+(B?card(B,'B · Ưu tiên linh hoạt'):'<div class="card">Không có phương án kỳ hạn ngắn hơn phù hợp.</div>')+'</div><div class="card" style="margin-top:14px"><h2>Thử rút trước hạn phương án A</h2><label class="field"><span>Sau bao nhiêu tháng?</span><input id="earlyM" type="number" min="1" max="'+A.t+'" value="1"></label><label class="field"><span>Số tiền rút (toàn bộ hoặc một phần)</span><input id="earlyP" type="number" min="1" max="'+p+'" value="'+p+'"></label><button onclick="early()">Tính thử</button><div id="earlyResult"></div></div>'}
function early(){if(!simulation)return;let {p,A}=simulation,m=Math.floor(num(val('earlyM'))),w=num(val('earlyP')),out=document.getElementById('earlyResult');if(m<1||m>A.t||w<=0||w>p||(m<A.t&&w<p&&(!A.b.partial||w<Math.max(A.b.minPartial,p*(A.b.minShare||0))||w>p*(A.b.maxShare??1)||p-w<A.b.remain))){out.innerHTML='<div class="warn">Không đủ điều kiện rút theo giả định sản phẩm.</div>';return}let interest=w*(m<A.t?A.b.early:A.r)/100*m/12,rest=(p-w)*A.r/100*A.t/12;out.innerHTML='<div class="good">Giả định lãi không kỳ hạn '+A.b.early+'%/năm khi rút sớm (chưa xác minh).<br>Tiền nhận lúc rút: '+cash(w+interest)+' (lãi '+cash(interest)+'). Phần còn lại tại đáo hạn: '+cash(p-w+rest)+'. Chênh lệch lãi trên phần rút: '+cash(Math.max(0,w*A.r/100*A.t/12-interest))+'. Không trừ vào gốc.</div>'}
render();
